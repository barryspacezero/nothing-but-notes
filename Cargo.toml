[package]
name = "nothing-notes"
version = "0.1.0"
edition = "2021"

[build-dependencies]
winres = "0.1"

[dependencies]
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
global-hotkey = "0.8.0"
arboard = "3.6.1"
crossbeam-channel = "0.5.17"
egui_extras = { version = "0.27.2", features = ["all_loaders"] }
image = "0.25.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
